name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Initialize Capacitor
        run: |
          echo '{"name":"voice-notes-ai","version":"1.0.0","private":true}' > package.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.voicenotes.ai","appName":"Voice Notes AI","webDir":"www"}' > capacitor.config.json
          mkdir -p www
          cp static/index.html www/index.html
          npx cap add android

      - name: Fix Kotlin conflict
        run: |
          printf '\nallprojects {\n  configurations.all {\n    resolutionStrategy {\n      force "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"\n      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22"\n    }\n  }\n}\n' >> android/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNotesAI.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
