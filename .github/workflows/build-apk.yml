name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor project
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"voice-notes-ai","version":"1.0.0","private":true}' > package.json
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.voicenotes.ai","appName":"Voice Notes AI","webDir":"www"}' > capacitor.config.json
          fi
          mkdir -p www
          cp -r static/* www/ 2>/dev/null || true
          npx cap add android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNotesAI.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
